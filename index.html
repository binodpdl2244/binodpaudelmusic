<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Binodpaudel Music</title>

<meta name="description"
content="Binodpaudel Music - Songs, Music and Lyrics">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0b0b0b;
  color:white;
  font-family:Arial,sans-serif;
}

header{
  padding:25px 15px;
  text-align:center;
  background:#111;
  border-bottom:1px solid #333;
}

header h1{
  margin:0;
  font-size:30px;
}

header p{
  color:#aaa;
  margin:8px 0 0;
}

.container{
  width:94%;
  max-width:900px;
  margin:25px auto;
}

.upload-box{
  background:#151515;
  padding:20px;
  border-radius:15px;
  margin-bottom:30px;
}

.upload-box h2{
  margin-top:0;
}

input,textarea{
  width:100%;
  margin:8px 0 15px;
  padding:13px;
  border-radius:8px;
  border:1px solid #444;
  background:#222;
  color:white;
  font-size:16px;
}

textarea{
  min-height:150px;
  resize:vertical;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:8px;
  background:#16a34a;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

#message{
  margin-top:15px;
  text-align:center;
  font-weight:bold;
}

.song{
  background:#151515;
  border-radius:15px;
  padding:15px;
  margin-bottom:25px;
}

.cover{
  width:100%;
  max-height:500px;
  object-fit:cover;
  border-radius:12px;
  display:block;
}

.song h2{
  margin-bottom:8px;
}

audio{
  width:100%;
  margin:12px 0;
}

.lyrics{
  white-space:pre-wrap;
  line-height:1.8;
  color:#ddd;
  background:#101010;
  padding:15px;
  border-radius:10px;
}

.loading{
  text-align:center;
  color:#aaa;
  padding:20px;
}
</style>
</head>

<body>

<header>
  <h1>Binodpaudel Music</h1>
  <p>My Songs • Music • Lyrics</p>
</header>

<div class="container">

  <div class="upload-box">

    <h2>🎵 Add New Song</h2>

    <input
      type="text"
      id="songTitle"
      placeholder="गीतको नाम"
    >

    <textarea
      id="lyrics"
      placeholder="गीतको Lyrics यहाँ लेख्नुहोस्"
    ></textarea>

    <label>🖼️ Cover Photo</label>
    <input
      type="file"
      id="cover"
      accept="image/*"
    >

    <label>🎧 MP3 Song</label>
    <input
      type="file"
      id="audio"
      accept="audio/*"
    >

    <button id="uploadBtn" onclick="uploadSong()">
      Upload Song
    </button>

    <div id="message"></div>

  </div>

  <h2>🎶 My Songs</h2>

  <div id="songs">
    <div class="loading">गीतहरू Loading हुँदैछन्...</div>
  </div>

</div>

<script>

/* ================================
   SUPABASE CONNECTION
================================ */

const SUPABASE_URL =
"https://kawzjxupkmakdndsgycn.supabase.co";

const SUPABASE_KEY =
"sb_publishable_9XP5jAQrpwCrbT-JDe7NyQ_gr6LmwZ1";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ================================
   UPLOAD SONG
================================ */

async function uploadSong(){

  const button =
    document.getElementById("uploadBtn");

  const message =
    document.getElementById("message");

  const title =
    document.getElementById("songTitle").value.trim();

  const lyrics =
    document.getElementById("lyrics").value.trim();

  const coverFile =
    document.getElementById("cover").files[0];

  const audioFile =
    document.getElementById("audio").files[0];


  if(!title){
    message.innerText =
      "❌ गीतको नाम राख्नुहोस्।";
    return;
  }

  if(!coverFile){
    message.innerText =
      "❌ Cover Photo छान्नुहोस्।";
    return;
  }

  if(!audioFile){
    message.innerText =
      "❌ MP3 Song छान्नुहोस्।";
    return;
  }


  button.disabled = true;

  message.innerText =
    "⏳ गीत Upload हुँदैछ...";


  try{

    const safeName =
      title
      .replace(/[^a-zA-Z0-9\u0900-\u097F]+/g,"-")
      .toLowerCase();

    const unique =
      Date.now();


    /* ================================
       COVER UPLOAD
    ================================= */

    const coverPath =
      "covers/" +
      unique +
      "-" +
      safeName +
      "." +
      getExtension(coverFile.name);


    const coverUpload =
      await supabaseClient
      .storage
      .from("music-files")
      .upload(
        coverPath,
        coverFile,
        {
          cacheControl:"3600",
          upsert:false
        }
      );


    if(coverUpload.error){
      throw coverUpload.error;
    }


    /* ================================
       AUDIO UPLOAD
    ================================= */

    const audioPath =
      "songs/" +
      unique +
      "-" +
      safeName +
      "." +
      getExtension(audioFile.name);


    const audioUpload =
      await supabaseClient
      .storage
      .from("music-files")
      .upload(
        audioPath,
        audioFile,
        {
          cacheControl:"3600",
          upsert:false
        }
      );


    if(audioUpload.error){
      throw audioUpload.error;
    }


    /* ================================
       PUBLIC URLS
    ================================= */

    const coverUrl =
      supabaseClient
      .storage
      .from("music-files")
      .getPublicUrl(coverPath)
      .data
      .publicUrl;


    const audioUrl =
      supabaseClient
      .storage
      .from("music-files")
      .getPublicUrl(audioPath)
      .data
      .publicUrl;


    /* ================================
       DATABASE
    ================================= */

    const { error:dbError } =
      await supabaseClient
      .from("songs")
      .insert({
        title:title,
        lyrics:lyrics,
        cover_url:coverUrl,
        audio_url:audioUrl
      });


    if(dbError){
      throw dbError;
    }


    message.innerText =
      "✅ गीत सफलतापूर्वक Upload भयो!";


    document.getElementById("songTitle").value = "";
    document.getElementById("lyrics").value = "";
    document.getElementById("cover").value = "";
    document.getElementById("audio").value = "";


    await loadSongs();

  }catch(error){

    console.error(error);

    message.innerText =
      "❌ Upload हुन सकेन: " +
      error.message;

  }


  button.disabled = false;
}


/* ================================
   LOAD SONGS
================================ */

async function loadSongs(){

  const songsBox =
    document.getElementById("songs");

  songsBox.innerHTML =
    '<div class="loading">गीतहरू Loading हुँदैछन्...</div>';


  const {
    data,
    error
  } =
    await supabaseClient
    .from("songs")
    .select("*")
    .order("id",{ascending:false});


  if(error){

    songsBox.innerHTML =
      "<p>❌ गीतहरू Loading हुन सकेन।</p>";

    console.error(error);

    return;
  }


  if(!data || data.length === 0){

    songsBox.innerHTML =
      "<p>अहिले कुनै गीत छैन।</p>";

    return;
  }


  songsBox.innerHTML = "";


  data.forEach(song => {

    const div =
      document.createElement("div");

    div.className = "song";


    const title =
      escapeHtml(song.title || "Untitled");

    const lyrics =
      escapeHtml(song.lyrics || "");


    div.innerHTML = `

      ${
        song.cover_url
        ?
        `<img
          class="cover"
          src="${song.cover_url}"
          alt="${title}"
          loading="lazy"
        >`
        :
        ""
      }

      <h2>🎵 ${title}</h2>

      ${
        song.audio_url
        ?
        `<audio
          controls
          preload="none"
          src="${song.audio_url}">
        </audio>`
        :
        ""
      }

      ${
        song.lyrics
        ?
        `<div class="lyrics">${lyrics}</div>`
        :
        ""
      }

    `;


    songsBox.appendChild(div);

  });

}


/* ================================
   HELPERS
================================ */

function getExtension(filename){

  const parts =
    filename.split(".");

  return parts.length > 1
    ? parts.pop()
    : "bin";
}


function escapeHtml(text){

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}


/* ================================
   START
================================ */

loadSongs();

</script>

</body>
</html>
