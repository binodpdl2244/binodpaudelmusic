<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Upload Song | Binodpaudel Music</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
margin:0;
padding:20px;
background:#0c0c0c;
color:white;
font-family:Arial,sans-serif
}
.box{
max-width:600px;
margin:20px auto;
background:#1a1a1a;
padding:25px;
border-radius:18px;
border:1px solid #333
}
h1{
text-align:center;
color:#ff4d4d
}
label{
display:block;
margin-top:18px;
margin-bottom:7px
}
input,textarea{
width:100%;
padding:13px;
background:#111;
color:white;
border:1px solid #444;
border-radius:10px
}
textarea{min-height:130px}
button{
width:100%;
margin-top:25px;
padding:15px;
border:0;
border-radius:30px;
background:#ff4d4d;
color:white;
font-size:17px;
font-weight:bold
}
button:disabled{opacity:.6}
#msg{
text-align:center;
margin-top:20px;
line-height:1.7
}
.success{color:#55e68a}
.error{color:#ff6b6b}
.back{
display:block;
text-align:center;
margin-top:20px;
color:#aaa
}
</style>
</head>

<body>

<div class="box">

<h1>🎵 Upload New Song</h1>

<label>गीतको नाम</label>
<input id="title" type="text" placeholder="जस्तै: Dil Mera">

<label>गीतको विवरण</label>
<input id="description" type="text"
placeholder="जस्तै: Emotional Hindi Song">

<label>Cover / Thumbnail</label>
<input id="cover" type="file" accept="image/*">

<label>MP3 गीत</label>
<input id="audio" type="file" accept=".mp3,audio/mpeg">

<label>Lyrics</label>
<textarea id="lyrics"
placeholder="यहाँ गीतका शब्दहरू राख्नुहोस्..."></textarea>

<button id="btn" onclick="uploadSong()">
Upload Song
</button>

<div id="msg"></div>

<a class="back" href="index.html">
← मुख्य वेबसाइटमा फर्कनुहोस्
</a>

</div>

<script>

const SUPABASE_URL =
"https://kawzjxupkmakdndsgycn.supabase.co";

const SUPABASE_KEY =
"sb_publishable_9XP5jAQrpwCrbT-JDe7NyQ_gr6LmwZ1";

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


async function uploadSong(){

const title =
document.getElementById("title").value.trim();

const description =
document.getElementById("description").value.trim();

const cover =
document.getElementById("cover").files[0];

const audio =
document.getElementById("audio").files[0];

const lyrics =
document.getElementById("lyrics").value.trim();

const msg =
document.getElementById("msg");

const btn =
document.getElementById("btn");


if(!title){
msg.className="error";
msg.innerText="गीतको नाम लेख्नुहोस्।";
return;
}

if(!cover){
msg.className="error";
msg.innerText="Cover Photo छान्नुहोस्।";
return;
}

if(!audio){
msg.className="error";
msg.innerText="MP3 गीत छान्नुहोस्।";
return;
}

btn.disabled=true;
btn.innerText="Uploading...";
msg.className="";
msg.innerText="⏳ Cover upload हुँदैछ...";


try{

const slug =
title
.toLowerCase()
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-+|-+$/g,"");

const time=Date.now();


/* COVER */

const coverExt =
cover.name.split(".").pop().toLowerCase();

const coverPath =
"covers/"+slug+"-"+time+"."+coverExt;

const {error:coverError} =
await db.storage
.from("music-files")
.upload(
coverPath,
cover,
{
cacheControl:"3600",
contentType:cover.type,
upsert:false
}
);

if(coverError)
throw new Error(
"Cover upload: "+
coverError.message
);


/* MP3 */

msg.innerText="⏳ MP3 upload हुँदैछ...";

const audioPath =
"songs/"+slug+"-"+time+".mp3";

const {error:audioError} =
await db.storage
.from("music-files")
.upload(
audioPath,
audio,
{
cacheControl:"3600",
contentType:"audio/mpeg",
upsert:false
}
);

if(audioError)
throw new Error(
"MP3 upload: "+
audioError.message
);


/* PUBLIC URL */

const coverURL =
db.storage
.from("music-files")
.getPublicUrl(coverPath)
.data.publicUrl;

const audioURL =
db.storage
.from("music-files")
.getPublicUrl(audioPath)
.data.publicUrl;


/* DATABASE */

msg.innerText="⏳ गीतको जानकारी save हुँदैछ...";

const {error:dbError} =
await db
.from("songs")
.insert({
title:title,
description:description,
lyrics:lyrics,
cover_url:coverURL,
audio_url:audioURL
});

if(dbError)
throw new Error(
"Database: "+
dbError.message
);


msg.className="success";

msg.innerHTML=
"✅ <strong>गीत सफलतापूर्वक प्रकाशित भयो!</strong><br><br>"+
"🎵 "+title+
"<br>🖼️ Cover सुरक्षित भयो"+
"<br>🎧 MP3 सुरक्षित भयो"+
"<br>📝 गीतको विवरण सुरक्षित भयो";


document.getElementById("title").value="";
document.getElementById("description").value="";
document.getElementById("lyrics").value="";
document.getElementById("cover").value="";
document.getElementById("audio").value="";


}catch(error){

console.error(error);

msg.className="error";

msg.innerHTML=
"❌ "+error.message;

}

btn.disabled=false;
btn.innerText="Upload Song";

}

</script>

</body>
</html>
