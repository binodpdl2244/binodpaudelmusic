<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Upload Song | Binodpaudel Music</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0c0c0c;
    color:white;
    padding:20px 15px;
}

.container{
    max-width:650px;
    margin:auto;
}

h1{
    text-align:center;
    color:#ff4d4d;
    margin:20px 0 30px;
}

.box{
    background:#181818;
    padding:25px;
    border-radius:20px;
    border:1px solid #333;
}

label{
    display:block;
    margin:18px 0 8px;
    font-size:16px;
}

input,textarea{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #444;
    background:#222;
    color:white;
    font-size:16px;
}

textarea{
    min-height:150px;
    resize:vertical;
}

button{
    width:100%;
    padding:16px;
    margin-top:25px;
    border:0;
    border-radius:30px;
    background:#16a34a;
    color:white;
    font-size:18px;
    font-weight:bold;
}

button:disabled{
    opacity:.6;
}

.preview{
    width:100%;
    max-height:350px;
    object-fit:cover;
    margin-top:15px;
    border-radius:15px;
    display:none;
}

.message{
    text-align:center;
    margin-top:20px;
    font-size:16px;
    line-height:1.5;
}

.song{
    background:#181818;
    margin-top:25px;
    padding:15px;
    border-radius:15px;
}

.song img{
    width:100%;
    border-radius:12px;
}

.song h2{
    margin:12px 0;
}

audio{
    width:100%;
}

.lyrics{
    white-space:pre-wrap;
    color:#ccc;
    line-height:1.7;
}

.back{
    display:block;
    text-align:center;
    margin:25px 0;
    color:#aaa;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

<h1>🎵 Binodpaudel Music</h1>

<div class="box">

<label>गीतको नाम</label>
<input id="songTitle" type="text" placeholder="जस्तै: तेरे बिना">

<label>गीतको विवरण</label>
<input id="songDescription" type="text"
placeholder="जस्तै: Emotional Hindi Song">

<label>गीतको Lyrics</label>
<textarea id="lyrics"
placeholder="यहाँ गीतका शब्दहरू लेख्नुहोस्..."></textarea>

<label>🖼️ Cover Photo</label>
<input id="cover" type="file" accept="image/*">

<img id="preview" class="preview">

<label>🎧 MP3 Song</label>
<input id="audio" type="file" accept="audio/*">

<button id="uploadBtn" onclick="uploadSong()">
Upload Song
</button>

<div id="message" class="message"></div>

</div>

<h1>🎶 My Songs</h1>

<div id="songs"></div>

<a class="back" href="index.html">
← मुख्य वेबसाइटमा फर्कनुहोस्
</a>

</div>

<script>

/* ==============================
   SUPABASE CONNECTION
================================ */

const SUPABASE_URL =
"https://kawzjxupkmakdndsgycn.supabase.co";

const SUPABASE_KEY =
"sb_publishable_9XP5jAQrpwCrbT-JDe7NyQ_gr6LmwZ1";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ==============================
   COVER PREVIEW
================================ */

const coverInput =
document.getElementById("cover");

const preview =
document.getElementById("preview");

coverInput.addEventListener("change", function(){

    const file = this.files[0];

    if(file){
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
    }

});


/* ==============================
   SAFE FILE EXTENSION
   नेपाली filename भए पनि
   अब समस्या हुँदैन
================================ */

function getExtension(file){

    const type = file.type.toLowerCase();

    if(type.includes("jpeg")) return "jpg";
    if(type.includes("png")) return "png";
    if(type.includes("webp")) return "webp";
    if(type.includes("gif")) return "gif";

    if(type.includes("mpeg")) return "mp3";
    if(type.includes("mp3")) return "mp3";
    if(type.includes("wav")) return "wav";
    if(type.includes("ogg")) return "ogg";
    if(type.includes("m4a")) return "m4a";

    return "bin";
}


/* ==============================
   UPLOAD SONG
================================ */

async function uploadSong(){

    const title =
    document.getElementById("songTitle").value.trim();

    const description =
    document.getElementById("songDescription").value.trim();

    const lyrics =
    document.getElementById("lyrics").value.trim();

    const cover =
    document.getElementById("cover").files[0];

    const audio =
    document.getElementById("audio").files[0];

    const message =
    document.getElementById("message");

    const button =
    document.getElementById("uploadBtn");


    if(!title){
        message.innerText =
        "❌ कृपया गीतको नाम लेख्नुहोस्।";
        return;
    }

    if(!cover){
        message.innerText =
        "❌ कृपया Cover Photo छान्नुहोस्।";
        return;
    }

    if(!audio){
        message.innerText =
        "❌ कृपया MP3 Song छान्नुहोस्।";
        return;
    }


    button.disabled = true;

    message.innerText =
    "⏳ गीत Upload हुँदैछ...";


    try{

        /* ==========================
           IMPORTANT:
           ORIGINAL FILE NAME प्रयोग
           गरिएको छैन।
           त्यसैले नेपाली filename
           बाट Invalid key हुँदैन।
        ========================== */

        const time = Date.now();

        const coverExt =
        getExtension(cover);

        const audioExt =
        getExtension(audio);

        const coverPath =
        "covers/" + time + "." + coverExt;

        const audioPath =
        "songs/" + time + "." + audioExt;


        /* ==========================
           COVER UPLOAD
        ========================== */

        const { error: coverError } =
        await supabaseClient
        .storage
        .from("music-files")
        .upload(
            coverPath,
            cover,
            {
                cacheControl:"3600",
                upsert:false,
                contentType:cover.type
            }
        );


        if(coverError){
            throw new Error(
                "Cover upload failed: " +
                coverError.message
            );
        }


        /* ==========================
           MP3 UPLOAD
        ========================== */

        const { error: audioError } =
        await supabaseClient
        .storage
        .from("music-files")
        .upload(
            audioPath,
            audio,
            {
                cacheControl:"3600",
                upsert:false,
                contentType:audio.type
            }
        );


        if(audioError){
            throw new Error(
                "Audio upload failed: " +
                audioError.message
            );
        }


        /* ==========================
           PUBLIC URL
        ========================== */

        const { data: coverData } =
        supabaseClient
        .storage
        .from("music-files")
        .getPublicUrl(coverPath);


        const { data: audioData } =
        supabaseClient
        .storage
        .from("music-files")
        .getPublicUrl(audioPath);


        const coverUrl =
        coverData.publicUrl;

        const audioUrl =
        audioData.publicUrl;


        /* ==========================
           SAVE SONG INFORMATION
           TO songs TABLE
        ========================== */

        const { error: dbError } =
        await supabaseClient
        .from("songs")
        .insert({

            title:title,

            description:description,

            lyrics:lyrics,

            cover_url:coverUrl,

            audio_url:audioUrl

        });


        if(dbError){
            throw new Error(
                "Database save failed: " +
                dbError.message
            );
        }


        /* ==========================
           SUCCESS
        ========================== */

        message.innerText =
        "✅ गीत, Cover Photo र Lyrics सफलतापूर्वक Upload भयो!";


        document.getElementById("songTitle").value = "";

        document.getElementById("songDescription").value = "";

        document.getElementById("lyrics").value = "";

        document.getElementById("cover").value = "";

        document.getElementById("audio").value = "";

        preview.style.display = "none";


        loadSongs();

    }

    catch(error){

        console.error(error);

        message.innerText =
        "❌ Upload हुन सकेन: " +
        error.message;

    }

    finally{

        button.disabled = false;

    }

}


/* ==============================
   LOAD ALL SONGS
================================ */

async function loadSongs(){

    const container =
    document.getElementById("songs");

    container.innerHTML =
    "⏳ गीतहरू Loading हुँदैछन्...";


    const { data, error } =
    await supabaseClient
    .from("songs")
    .select("*")
    .order("id",{ascending:false});


    if(error){

        container.innerHTML =
        "❌ गीतहरू Load हुन सकेन: " +
        error.message;

        return;

    }


    if(!data || data.length === 0){

        container.innerHTML =
        "अहिले कुनै गीत छैन।";

        return;

    }


    container.innerHTML = "";


    data.forEach(song => {

        const div =
        document.createElement("div");

        div.className = "song";


        const image =
        document.createElement("img");

        image.src =
        song.cover_url;

        image.alt =
        song.title;


        const heading =
        document.createElement("h2");

        heading.innerText =
        "🎵 " + song.title;


        div.appendChild(image);

        div.appendChild(heading);


        if(song.description){

            const desc =
            document.createElement("p");

            desc.innerText =
            song.description;

            div.appendChild(desc);

        }


        const player =
        document.createElement("audio");

        player.controls = true;

        player.src =
        song.audio_url;

        div.appendChild(player);


        if(song.lyrics){

            const lyrics =
            document.createElement("div");

            lyrics.className =
            "lyrics";

            lyrics.innerText =
            song.lyrics;

            div.appendChild(lyrics);

        }


        container.appendChild(div);

    });

}


/* ==============================
   START
================================ */

loadSongs();

</script>

</body>
</html>
