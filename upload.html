<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Song | Binodpaudel Music</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0c0c0c;
    color:#fff;
    padding:20px 15px;
}

.container{
    max-width:600px;
    margin:20px auto;
    background:#1a1a1a;
    padding:25px;
    border-radius:18px;
    border:1px solid #333;
}

h1{
    text-align:center;
    color:#ff4d4d;
}

label{
    display:block;
    margin:18px 0 7px;
    color:#ddd;
}

input,textarea{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:1px solid #444;
    background:#111;
    color:#fff;
}

textarea{
    min-height:120px;
}

button{
    width:100%;
    margin-top:25px;
    padding:14px;
    border:0;
    border-radius:30px;
    background:#ff4d4d;
    color:white;
    font-size:16px;
    font-weight:bold;
}

#message{
    text-align:center;
    margin-top:20px;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#aaa;
}
</style>
</head>

<body>

<div class="container">

<h1>🎵 Upload New Song</h1>

<label>गीतको नाम</label>
<input type="text" id="songTitle" placeholder="जस्तै: Dil Mera">

<label>गीतको विवरण</label>
<input type="text" id="songDescription"
placeholder="जस्तै: Emotional Hindi Song">

<label>Cover / Thumbnail</label>
<input type="file" id="cover" accept="image/*">

<label>MP3 गीत</label>
<input type="file" id="audio" accept="audio/*">

<label>Lyrics</label>
<textarea id="lyrics"
placeholder="यहाँ गीतका शब्दहरू राख्नुहोस्..."></textarea>

<button onclick="uploadSong()">Upload Song</button>

<div id="message"></div>

<a class="back" href="index.html">
← मुख्य वेबसाइटमा फर्कनुहोस्
</a>

</div>

<script>

/* Supabase connection */
const SUPABASE_URL =
"https://kawzjxupkmakdndsgycn.supabase.co";

const SUPABASE_KEY =
sb_publishable_9XP5jAQrpwCrbT-JDe7NyQ_gr6LmwZ1;


async function uploadSong(){

    const title =
    document.getElementById("songTitle").value.trim();

    const description =
    document.getElementById("songDescription").value.trim();

    const cover =
    document.getElementById("cover").files[0];

    const audio =
    document.getElementById("audio").files[0];

    const lyrics =
    document.getElementById("lyrics").value;

    const message =
    document.getElementById("message");


    if(!title || !cover || !audio){

        message.innerText =
        "कृपया गीतको नाम, Cover Photo र MP3 छान्नुहोस्।";

        return;
    }


    message.innerText =
    "⏳ Upload हुँदैछ...";


    try{

        const safeTitle =
        title.toLowerCase()
        .replace(/[^a-z0-9]+/g,"-")
        .replace(/^-|-$/g,"");


        const time = Date.now();


        /* Cover upload */

        const coverName =
        "covers/" + safeTitle + "-" + time + ".jpg";


        const coverResponse =
        await fetch(
        SUPABASE_URL +
        "/storage/v1/object/music-files/" +
        coverName,
        {
            method:"POST",

            headers:{
                "Authorization":
                "Bearer " + SUPABASE_KEY,

                "apikey":
                SUPABASE_KEY,

                "Content-Type":
                cover.type
            },

            body:cover
        });


        if(!coverResponse.ok){

            throw new Error(
            "Cover upload failed"
            );
        }


        /* MP3 upload */

        const audioName =
        "songs/" + safeTitle + "-" + time + ".mp3";


        const audioResponse =
        await fetch(
        SUPABASE_URL +
        "/storage/v1/object/music-files/" +
        audioName,
        {
            method:"POST",

            headers:{
                "Authorization":
                "Bearer " + SUPABASE_KEY,

                "apikey":
                SUPABASE_KEY,

                "Content-Type":
                audio.type
            },

            body:audio
        });


        if(!audioResponse.ok){

            throw new Error(
            "Audio upload failed"
            );
        }


        message.innerText =
        "✅ गीत सफलतापूर्वक Upload भयो!";


        console.log({
            title,
            description,
            lyrics,
            coverName,
            audioName
        });


    }catch(error){

        console.error(error);

        message.innerText =
        "❌ Upload हुन सकेन। Policy वा key जाँच गर्नुहोस्।";
    }

}

</script>

</body>
</html>
